<nav
  class="mb-1 navbar navbar-expand-lg navbar-light secondary-color lighten-1"
>
  <div class="container">
    <a class="navbar-brand" routerLink="/">
      <img
        alt="LandVille logo"
        height="34"
        src="assets/img/ICON/Logo Icon.png"
      />
      <span class="brand-name ml-2">LandVille</span>
    </a>
    <button
      aria-controls="navbarSupportedContent-5"
      aria-expanded="false"
      aria-label="Toggle navigation"
      class="navbar-toggler collapsed"
      data-target="#navbarSupportedContent-5"
      data-toggle="collapse"
      type="button"
    >
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="navbar-collapse collapse" id="navbarSupportedContent-5">
      <ul class="navbar-nav ml-auto nav-flex-icons">
        <li class="nav-item active">
          <a
            class="nav-link waves-effect waves-light"
            routerLink="/"
            routerLinkActive="active"
          >Home
            <span class="sr-only">(current)</span>
          </a>
        </li>
        <li class="nav-item">
          <a
            class="nav-link waves-effect waves-light"
            routerLink="/properties"
            routerLinkActive="active"
          >Properties</a
          >
        </li>
        <li *ngIf="authenticated" class="nav-item">
          <a
            class="nav-link waves-effect waves-light"
            routerLink="/my-listings"
            routerLinkActive="active"
          >My Listings</a
          >
        </li>
        <li *ngIf="authenticated" class="nav-item">
          <a
            class="nav-link waves-effect waves-light"
            routerLink="/messages"
            routerLinkActive="active"
          ><i class="fa fa-comments mr-1"></i>Messages</a
          >
        </li>
        <li *ngIf="authenticated" class="nav-item">
          <a
            class="nav-link nav-cta waves-effect waves-light"
            routerLink="/create-listing"
            routerLinkActive="active"
          ><i class="fa fa-plus mr-1"></i>List a property</a
          >
        </li>
        <li *ngIf="!authenticated" class="nav-item">
          <a class="btn-auth" routerLink="/register" routerLinkActive="active"
          >Sign up</a
          >
        </li>
        <li *ngIf="!authenticated" class="nav-item">
          <a class="btn-auth" routerLink="/login" routerLinkActive="active"
          >Log in
          </a>
        </li>
        <li *ngIf="authenticated" class="nav-item avatar dropdown">
          <a
            aria-expanded="false"
            aria-haspopup="true"
            class="nav-link dropdown-toggle waves-effect waves-light"
            data-toggle="dropdown"
            id="navbarDropdownMenuLink-6"
          >
            <span class="profile-ava">
              <img
                [src]="profileImage"
                alt="avatar image"
                class="rounded-circle z-depth-0"
                height="35"
                alt=""
              />
            </span>
            <span class="username">{{ firstName }} {{ lastName }}</span>
            <b class="caret"></b>
          </a>
          <div
            aria-labelledby="navbarDropdownMenuLink-6"
            class="dropdown-menu dropdown-menu-lg-right dropdown-secondary"
          >
            <a
              class="dropdown-item waves-effect waves-light eborder-top"
              routerLink="/profile"
              routerLinkActive="active"
            ><i class="fa fa-user"></i> My Profile</a
            >
            <a
              class="dropdown-item waves-effect waves-light"
              routerLink="/reset-link"
            ><i class="fa fa-plus"></i> Password Reset</a
            >
            <a
              (click)="handleLogout()"
              class="dropdown-item waves-effect waves-light profileDropDown"
              id="logoutBtn"
            >
              <i class="fa fa-sign-out"></i> Log Out</a
            >
          </div>
        </li>
      </ul>
    </div>
  </div>
</nav>
